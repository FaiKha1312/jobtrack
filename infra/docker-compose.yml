services:
  db:
    image: postgres:17
    container_name: jobtrack-db
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack
    ports:
      - "5432:5432"
    volumes:
      - jobtrack-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack -d jobtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5.2.1
    container_name: jobtrack-adminer
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  jobtrack-data: